<style>
:root{
  --bg:#07040f;--bg2:#14081f;--fg:#f8effd;--muted:#bba8cf;
  --accent:#ff3d9a;--accent2:#8a5cff;--gold:#ffd27a;
  --card:rgba(255,255,255,.06);--line:rgba(255,255,255,.13);
  --shadow:0 24px 70px rgba(0,0,0,.55);--beat:0;
  --head:'Unbounded','Manrope',system-ui,sans-serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
[data-theme="light"]{
  --bg:#fff4fa;--bg2:#ffe3f1;--fg:#2b1036;--muted:#7b5a8d;
  --card:rgba(255,255,255,.72);--line:rgba(90,20,100,.16);
  --shadow:0 24px 60px rgba(170,40,120,.2);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--bg);color:var(--fg);overflow-x:hidden;line-height:1.55;transition:background .5s,color .5s;min-height:100vh}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(70vmax 50vmax at 15% 0%,rgba(255,61,154,.22),transparent 60%),radial-gradient(60vmax 50vmax at 100% 40%,rgba(138,92,255,.2),transparent 60%),linear-gradient(180deg,var(--bg),var(--bg2))}
a{color:inherit}
img{max-width:100%;display:block}
button{font-family:inherit}

#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#spot{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(520px circle at var(--mx,50%) var(--my,30%),rgba(255,61,154,.15),transparent 62%)}
#grain{position:fixed;inset:0;width:100%;height:100%;z-index:50;pointer-events:none;opacity:.075;mix-blend-mode:overlay;image-rendering:pixelated}
@media (hover:none){#spot{display:none}}

/* letterbox */
.lb{position:fixed;left:0;right:0;height:14vh;background:#000;z-index:101;pointer-events:none;transition:height 1.8s cubic-bezier(.7,0,.2,1) .25s}
.lb.t{top:0}.lb.b{bottom:0}
body.entered .lb{height:0}

/* intro */
#intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;text-align:center;padding:20px;
  background:radial-gradient(60vmax 60vmax at 50% 40%,#2a0b3d,#05020b 70%);transition:opacity 1.3s,transform 1.6s,visibility 1.6s}
#intro.out{opacity:0;transform:scale(1.15);visibility:hidden;pointer-events:none}
.disc{width:min(52vw,220px);aspect-ratio:1;margin:0 auto 22px;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(255,255,255,.18),transparent 18%,rgba(255,255,255,.14) 50%,transparent 70%,rgba(255,255,255,.18)),repeating-radial-gradient(circle,#0c0c10 0 2px,#1c1c22 3px 4px);
  box-shadow:0 0 70px rgba(255,61,154,.5);animation:spin 5s linear infinite;position:relative}
.disc::after{content:"";position:absolute;inset:36%;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:inset 0 0 0 5px rgba(0,0,0,.35)}
#intro h2{font-family:var(--head);font-weight:900;font-size:clamp(44px,13vw,110px);letter-spacing:.08em;background:linear-gradient(90deg,#ff3d9a,#ffd27a,#8a5cff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(255,61,154,.6))}
#intro p.sub{letter-spacing:.35em;text-transform:uppercase;font-size:12px;color:#d8c4ee;margin:6px 0 26px}
#intro .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
#intro .hint{margin-top:18px;font-size:12.5px;color:#9f89b8}

/* controls */
.brand{position:fixed;top:max(14px,env(safe-area-inset-top));left:14px;z-index:60;display:flex;align-items:center;gap:9px;text-decoration:none;font-family:var(--head);font-weight:900;letter-spacing:.14em;font-size:15px;text-shadow:0 2px 14px rgba(0,0,0,.4)}
.meq{display:flex;align-items:flex-end;gap:2px;height:16px}
.meq i{display:block;width:3px;border-radius:2px;background:linear-gradient(var(--accent),var(--accent2));animation:eq 1s ease-in-out infinite}
.meq i:nth-child(2){animation-delay:.2s}.meq i:nth-child(3){animation-delay:.4s}.meq i:nth-child(4){animation-delay:.1s}
body.muted .meq i{animation-play-state:paused;height:4px!important}
.ctrl{position:fixed;top:max(10px,env(safe-area-inset-top));right:12px;display:flex;gap:8px;z-index:60}
.cbtn{height:44px;min-width:44px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-weight:800;font-size:13px;transition:transform .2s,background .3s}
.cbtn:hover{transform:translateY(-2px) scale(1.05)}
.cbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#lang{display:flex;gap:2px;padding:0 6px;align-items:center}
#lang span{padding:6px 8px;border-radius:999px;opacity:.55;transition:.25s}
#lang span.on{background:linear-gradient(120deg,var(--accent),var(--accent2));color:#fff;opacity:1}
[data-theme="dark"] .i-moon,[data-theme="light"] .i-sun{display:none}
body.muted .wave{display:none}
.slash{display:none}body.muted .slash{display:block}
.nav{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:55;display:none;gap:4px;padding:5px;border-radius:999px;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.nav a{padding:8px 15px;border-radius:999px;text-decoration:none;font-size:13px;font-weight:700;opacity:.8;transition:.25s}
.nav a:hover{background:linear-gradient(120deg,var(--accent),var(--accent2));color:#fff;opacity:1}
@media(min-width:1050px){.nav{display:flex}}
.np{position:fixed;left:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:60;display:flex;align-items:center;gap:10px;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:12.5px;font-weight:700;cursor:pointer}
@media(max-width:520px){.np{padding:8px 12px;font-size:11.5px}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 26px;border-radius:999px;font-weight:800;font-size:15px;border:1px solid var(--line);color:var(--fg);background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer;text-decoration:none;transition:transform .2s,box-shadow .25s}
.btn:hover{transform:translateY(-3px)}
.btn.primary{border:0;color:#fff;background:linear-gradient(120deg,var(--accent),var(--accent2));box-shadow:0 12px 34px -10px rgba(255,61,154,.85)}
.btn.primary:hover{box-shadow:0 18px 44px -8px rgba(255,61,154,.95)}

/* hero */
.hero{position:relative;z-index:2;min-height:100vh;min-height:100svh;display:flex;align-items:center;padding:96px 20px 70px;overflow:hidden;--beat:0}
.leak{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(90px);opacity:.34;pointer-events:none;animation:drift 18s ease-in-out infinite alternate;mix-blend-mode:screen}
.leak.l1{left:-25vmax;top:-20vmax;background:radial-gradient(circle,#ff3d9a,transparent 65%)}
.leak.l2{right:-30vmax;bottom:-25vmax;background:radial-gradient(circle,#6a4bff,transparent 65%);animation-delay:-8s}
[data-theme="light"] .leak{mix-blend-mode:normal;opacity:.22}
@media(max-width:700px){.leak{filter:blur(55px)}}
.hero-in{position:relative;max-width:1200px;margin:0 auto;width:100%;display:grid;gap:34px;align-items:center;grid-template-columns:1fr}
@media(min-width:900px){.hero-in{grid-template-columns:1.1fr .9fr}}
.kicker{letter-spacing:.34em;text-transform:uppercase;font-size:12px;font-weight:800;color:var(--accent);margin-bottom:10px}
.logo{font-family:var(--head);font-weight:900;font-size:clamp(70px,19vw,210px);line-height:.95;letter-spacing:.02em;display:flex;transform:scale(calc(1 + var(--beat)*.025));transform-origin:left center;filter:drop-shadow(0 0 26px rgba(255,61,154,.55))}
.logo span{background:linear-gradient(120deg,#ff3d9a,#ffd27a 45%,#8a5cff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:grad 6s linear infinite,flick 5s infinite}
.logo span:nth-child(2){animation-delay:0s,.4s}.logo span:nth-child(3){animation-delay:0s,1.1s}.logo span:nth-child(4){animation-delay:0s,2.3s}.logo span:nth-child(5){animation-delay:0s,.8s}
.real{font-family:var(--head);font-size:clamp(15px,3.2vw,26px);letter-spacing:.3em;text-transform:uppercase;margin:6px 0 16px;font-weight:400}
.tag{font-size:clamp(16px,2.4vw,21px);color:var(--muted);max-width:520px;margin-bottom:26px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.stagger{opacity:0;transform:translateY(34px)}
body.entered .stagger{animation:rise 1.1s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--d,0)*.14s + 1.2s)}
.vinyl-wrap{position:relative;justify-self:center;width:min(74vw,440px);aspect-ratio:1;transform:scale(calc(1 + var(--beat)*.05));cursor:pointer}
@media(max-width:899px){.vinyl-wrap{order:-1;width:min(62vw,320px);margin-top:6px}}
.halo{position:absolute;inset:-9%;border-radius:50%;background:conic-gradient(from 0deg,#ff3d9a,#ffd27a,#8a5cff,#ff3d9a);filter:blur(34px);opacity:.5;animation:spin 9s linear infinite}
.vinyl{position:relative;width:100%;height:100%;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(255,255,255,.2),transparent 16%,rgba(255,255,255,.13) 48%,transparent 66%,rgba(255,255,255,.2)),repeating-radial-gradient(circle,#09090c 0 2px,#1d1d24 3px 4px);
  box-shadow:0 30px 80px rgba(0,0,0,.65),inset 0 0 0 6px #050507;animation:spin 5.5s linear infinite;animation-play-state:paused}
.vinyl-wrap.playing .vinyl{animation-play-state:running}
.label{position:absolute;inset:31%;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 0 5px #0a0a0e,0 0 40px rgba(255,61,154,.6)}
.label img{position:absolute;width:260%;max-width:none;left:-85.2%;top:-2%}
.scroll-hint{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:26px;height:44px;border:2px solid var(--line);border-radius:20px;opacity:.8}
.scroll-hint::after{content:"";position:absolute;left:50%;top:8px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:var(--accent);animation:wheel 1.6s infinite}
@media(max-height:620px){.scroll-hint{display:none}}

/* marquee */
.marq{position:relative;z-index:2;overflow:hidden;border-block:1px solid var(--line);background:var(--card);backdrop-filter:blur(8px);padding:14px 0;transform:rotate(-1.2deg);margin:10px -10px}
.marq div{display:flex;width:max-content;animation:marq 28s linear infinite;font-family:var(--head);font-weight:900;font-size:clamp(16px,3vw,28px);letter-spacing:.12em;white-space:nowrap}
.marq span{padding:0 22px;background:linear-gradient(90deg,var(--accent),var(--gold),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}

/* sections */
.sec{position:relative;z-index:2;max-width:1200px;margin:0 auto;padding:clamp(70px,11vw,140px) 20px 20px}
.sec h2{font-family:var(--head);font-weight:900;font-size:clamp(26px,5.2vw,56px);line-height:1.08;letter-spacing:-.02em;margin-bottom:14px;background:linear-gradient(90deg,var(--fg),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.sec .lead{color:var(--muted);font-size:clamp(15px,2vw,19px);max-width:660px;margin-bottom:34px}
.reveal{opacity:0;transform:translateY(46px);transition:opacity .9s,transform .9s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}

/* video */
.vcard{display:block;position:relative;border-radius:24px;overflow:hidden;aspect-ratio:16/9;background:#111;border:1px solid var(--line);box-shadow:var(--shadow);text-decoration:none;color:#fff;transition:transform .18s,opacity .9s;will-change:transform}
.vcard img{width:100%;height:100%;object-fit:cover;transition:transform .9s}
.vcard:hover img{transform:scale(1.07)}
.vshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18) 0,rgba(0,0,0,.05) 40%,rgba(0,0,0,.82) 100%)}
.vplay{position:absolute;left:50%;top:50%;width:clamp(64px,12vw,98px);aspect-ratio:1;margin:calc(clamp(64px,12vw,98px)/-2) 0 0 calc(clamp(64px,12vw,98px)/-2);border-radius:50%;background:linear-gradient(120deg,var(--accent),var(--accent2));animation:pulse 2s infinite;display:grid;place-items:center}
.vplay::after{content:"";margin-left:8%;border-left:26px solid #fff;border-block:16px solid transparent}
.vbadge{position:absolute;top:14px;padding:7px 14px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.04em;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.vbadge.yt{left:14px;background:rgba(220,20,40,.9)}
.vbadge.vw{right:14px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.2)}
.vmeta{position:absolute;left:0;right:0;bottom:0;padding:clamp(14px,3vw,28px)}
.vmeta h3{font-family:var(--head);font-weight:900;font-size:clamp(20px,4.4vw,42px);line-height:1.05}
.vmeta p{opacity:.88;font-size:clamp(12.5px,1.9vw,17px);margin-top:4px}
.vmeta .meq{height:22px;margin-bottom:8px}.vmeta .meq i{width:4px}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.g-card{--c:#ff3d9a;position:relative;grid-column:span 4;aspect-ratio:4/5;border:0;padding:0;border-radius:22px;overflow:hidden;cursor:pointer;color:#fff;text-align:left;background:linear-gradient(135deg,#2a1240,#6a1f58);box-shadow:var(--shadow);transition:transform .18s,box-shadow .4s,opacity .9s;will-change:transform}
.g-card.wide{grid-column:span 12;aspect-ratio:2.4/1}
.g-card:hover{box-shadow:0 26px 80px -14px var(--c)}
.g-card img{width:100%;height:100%;object-fit:cover;transition:transform .9s,filter .6s}
.g-card:hover img{transform:scale(1.08)}
.g-card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.78));pointer-events:none}
.g-cap{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:16px 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.g-cap b{font-family:var(--head);font-size:clamp(14px,2.2vw,22px);font-weight:700}
.g-cap i{font-style:normal;font-size:12px;font-weight:800;padding:6px 12px;border-radius:999px;background:var(--c);color:#fff;white-space:nowrap}
.g-card.nophoto::before{content:"♪";position:absolute;inset:0;display:grid;place-items:center;font-size:90px;opacity:.3}
.g-card.nophoto img{display:none}
@media(max-width:700px){.gal{gap:10px}.g-card{grid-column:span 6;aspect-ratio:3/4;border-radius:18px}.g-card.last{grid-column:span 12;aspect-ratio:4/5}}

/* lightbox */
.lightbox{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:radial-gradient(70vmax 70vmax at 50% 50%,color-mix(in srgb,var(--lbc,#ff3d9a) 22%,#05020b),#05020b 75%);cursor:pointer}
.lightbox.open{display:flex;animation:fade .45s}
.lightbox figure{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:94vw}
.lightbox img{max-width:94vw;max-height:76vh;border-radius:18px;box-shadow:0 0 90px -10px var(--lbc,#ff3d9a),0 30px 90px rgba(0,0,0,.7);animation:pop .7s cubic-bezier(.2,.9,.2,1)}
.lightbox figcaption{color:#fff;text-align:center}
.lightbox figcaption b{display:block;font-family:var(--head);font-size:clamp(18px,3vw,30px)}
.lightbox figcaption span{opacity:.75;font-size:13px}
.lbx,.lbn{position:absolute;z-index:92;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.45);color:#fff;border-radius:50%;width:48px;height:48px;font-size:26px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.lbx{top:max(14px,env(safe-area-inset-top));right:14px}
.lbn{top:50%;margin-top:-24px}.lbn.p{left:12px}.lbn.n{right:12px}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:91;pointer-events:none;display:none}

/* beat pad */
.pad{border:1px solid var(--line);background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:26px;padding:clamp(14px,3vw,30px);box-shadow:var(--shadow)}
.sq-row{display:grid;grid-template-columns:78px 1fr;gap:10px;align-items:center;margin-bottom:10px}
@media(min-width:600px){.sq-row{grid-template-columns:120px 1fr}}
.rl{font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cells{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}
.cell{aspect-ratio:1;min-height:34px;border-radius:12px;border:1px solid var(--line);background:rgba(127,127,127,.12);cursor:pointer;transition:transform .12s,background .2s,box-shadow .2s}
.cell:active{transform:scale(.88)}
.cell.on{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;box-shadow:0 0 18px -2px var(--accent)}
.cell.cur{outline:2px solid var(--gold);outline-offset:1px}
.sq-ctl{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:18px}
.tempo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:13px;margin-left:auto}
.tempo input{accent-color:var(--accent);width:130px}
@media(max-width:600px){.tempo{margin-left:0;width:100%}.tempo input{flex:1}}

/* thanks */
.thanks{text-align:center;max-width:820px;margin:0 auto}
.count{font-family:var(--head);font-weight:900;font-size:clamp(46px,13vw,130px);line-height:1;background:linear-gradient(90deg,var(--accent),var(--gold),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px rgba(255,61,154,.4))}
.count-l{letter-spacing:.3em;text-transform:uppercase;font-weight:800;font-size:13px;color:var(--muted);margin:6px 0 24px}
.thanks h2{margin-bottom:12px}
.thanks p{color:var(--muted);font-size:clamp(15px,2vw,18px)}

/* contacts */
.cgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.ccard{--c:#ff3d9a;display:flex;align-items:center;gap:16px;padding:20px;border-radius:22px;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);text-decoration:none;transition:transform .2s,box-shadow .3s,border-color .3s}
.ccard:hover{transform:translateY(-5px);border-color:var(--c);box-shadow:0 18px 50px -16px var(--c)}
.cic{flex:none;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:var(--c);color:#fff;font-family:var(--head);font-weight:900;font-size:20px}
.ccard b{display:block;font-size:17px}.ccard small{color:var(--muted);font-size:13.5px}

/* share */

const PROG=[{r:45,c:[57,60,64]},{r:41,c:[53,57,60]},{r:48,c:[55,60,64]},{r:43,c:[55,59,62]}];
const M={bpm:100,step:0,next:0,timer:null,run:false};
function playStep(s,t){
 const bar=Math.floor(s/16)%4,st=s%16,p=PROG[bar],d=AE.music,spb=60/M.bpm;
 if(st===0)p.c.forEach(n=>[-8,8].forEach(dt=>tone({type:'sawtooth',f:mtof(n),detune:dt,t,dur:spb*4,vol:.028,a:.55,cut:850,dest:d,send:.3})));
 if(st===0||st===6||st===10)kick(t,d);
 if(st===4||st===12)clap(t,d);
 if(st%2===0)hat(t,d,false);if(st===14)hat(t,d,true);
 if(st===0||st===3||st===6||st===10||st===13)bass(p.r,t,spb*.55,d);
 if(st%2===0){const k=(st/2)%4;pluck(p.c[k%3]+12+(k===3?12:0),t,d)}
 if(st===8&&bar%2===1)bell(p.c[2]+12,t,d);
 if(st===0&&bar===0)bell(81,t+spb,d);
}

const SP_PUFF=spriteMake(128,[[0,'rgba(255,215,236,.95)'],[.5,'rgba(255,150,206,.38)'],[1,'rgba(255,150,206,0)']]);

function fxResize(){const d=Math.min(devicePixelRatio||1,mobile()?1.25:1.5);FX.w=innerWidth;FX.h=innerHeight;FX.cv.width=FX.w*d;FX.cv.height=FX.h*d;FX.cx.setTransform(d,0,0,d,0,0)}
const maxItems=()=>mobile()?80:160;
const add=o=>{if(FX.items.length<maxItems())FX.items.push(o)};
function mkBolt(x0,x1,y1){const p=[[x0,0]],n=14;for(let i=1;i<=n;i++){const f=i/n;p.push([x0+(x1-x0)*f+(i<n?rnd(-40,40):0),y1*f])}return p}
function spawn(m,x,y,burst){
 const w=FX.w,h=FX.h,hx=x??w/2,hy=y??h/2;
 if(m==='neon'){
  add({k:'ring',x:hx,y:hy,max:rnd(200,460),life:0,dur:1.5,hue:Math.random()<.5?320:190});
  if(burst){add({k:'ring',x:hx,y:hy,max:rnd(120,260),life:-.1,dur:1.2,hue:190});add({k:'ring',x:hx,y:hy,max:rnd(80,180),life:-.2,dur:1,hue:50})}
 }else if(m==='cloud'){
  if(burst){for(let i=0;i<7;i++)add({k:'puff',x:hx+rnd(-30,30),y:hy+rnd(-20,20),vx:rnd(-40,40),vy:rnd(-90,-30),s:rnd(70,150),life:0,dur:rnd(2.5,4)})}
  else add({k:'puff',x:rnd(0,w),y:h+120,vx:rnd(-14,14),vy:rnd(-85,-45),s:rnd(110,240),life:0,dur:rnd(7,10)});
 }else if(m==='gold'){
  if(burst){for(let i=0;i<28;i++){const a=rnd(0,6.283),sp=rnd(90,340);add({k:'spark',x:hx,y:hy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-80,g:340,s:rnd(3,8),life:0,dur:rnd(1.2,2.4),ph:rnd(0,6)})}}
  else add({k:'spark',x:rnd(0,w),y:-10,vx:rnd(-20,20),vy:rnd(70,170),g:0,s:rnd(3,8),life:0,dur:rnd(3,5),ph:rnd(0,6)});
 }else if(m==='volt'){
  const tx=x??rnd(w*.15,w*.85),ty=y??rnd(h*.4,h*.9);
  add({k:'bolt',pts:mkBolt(x!=null?rnd(w*.2,w*.8):tx+rnd(-80,80),tx,ty),life:0,dur:.5});
  if(Math.random()<.6)add({k:'bolt',pts:mkBolt(rnd(w*.1,w*.9),rnd(w*.1,w*.9),rnd(h*.4,h*.95)),life:-.06,dur:.4});
  add({k:'flare',y:ty,life:0,dur:.7});FX.flash=.28;
 }

const EMIT={neon:.8,cloud:.34,gold:.05,volt:1.7};
function fxFrame(t){
 if(!FX.on)return;
 const dt=Math.min(.05,(t-FX.last)/1000||0);FX.last=t;const c=FX.cx,w=FX.w,h=FX.h;
 c.clearRect(0,0,w,h);FX.acc+=dt;const iv=EMIT[FX.mode];
 while(FX.acc>iv){FX.acc-=iv;spawn(FX.mode)}
 c.globalCompositeOperation='lighter';
 for(let i=FX.items.length-1;i>=0;i--){
  const it=FX.items[i];it.life+=dt;if(it.life<0)continue;
  if(it.life>it.dur){FX.items.splice(i,1);continue}
  const p=it.life/it.dur;
  if(it.k==='ring'){const r=12+it.max*(1-Math.pow(1-p,3));c.strokeStyle=`hsla(${it.hue},100%,66%,${(1-p)*.9})`;c.lineWidth=1.5+(1-p)*5;c.beginPath();c.arc(it.x,it.y,r,0,6.283);c.stroke()}
  else if(it.k==='puff'){it.x+=it.vx*dt;it.y+=it.vy*dt;c.globalAlpha=Math.sin(p*Math.PI)*.75;c.drawImage(SP_PUFF,it.x-it.s/2,it.y-it.s/2,it.s,it.s);c.globalAlpha=1}
  else if(it.k==='spark'){
   it.vy+=it.g*dt;it.x+=it.vx*dt;it.y+=it.vy*dt;const tw=.55+.45*Math.sin(it.life*14+it.ph),a=Math.sin(p*Math.PI)*tw,s=it.s;
   c.globalAlpha=a;c.drawImage(SP_GOLD,it.x-s*3,it.y-s*3,s*6,s*6);
   c.strokeStyle='rgba(255,240,190,.95)';c.lineWidth=1.2;c.beginPath();c.moveTo(it.x-s*1.6,it.y);c.lineTo(it.x+s*1.6,it.y);c.moveTo(it.x,it.y-s*1.6);c.lineTo(it.x,it.y+s*1.6);c.stroke();c.globalAlpha=1;
  }
  else if(it.k==='bolt'){
   const a=Math.max(0,1-p)*(Math.random()<.25?.4:1);c.strokeStyle=`rgba(150,205,255,${a})`;c.lineWidth=2.6;c.shadowColor='#4aa3ff';c.shadowBlur=14;
   c.beginPath();it.pts.forEach((q,j)=>j?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));c.stroke();c.shadowBlur=0;
  }
  else if(it.k==='flare'){
   const a=Math.sin(p*Math.PI)*.8,g=c.createLinearGradient(0,0,w,0);g.addColorStop(0,'rgba(80,150,255,0)');g.addColorStop(.5,`rgba(170,215,255,${a})`);g.addColorStop(1,'rgba(80,150,255,0)');
   c.fillStyle=g;c.fillRect(0,it.y-2,w,4);
  }
 }
 if(FX.flash>0){c.globalCompositeOperation='source-over';c.fillStyle=`rgba(110,165,255,${FX.flash})`;c.fillRect(0,0,w,h);FX.flash=Math.max(0,FX.flash-dt*1.5)}
 requestAnimationFrame(fxFrame);
}

 SQ.run=true;SQ.step=0;SQ.q=[];SQ.next=AE.ctx.currentTime+.06;SQ.timer=setInterval(sqTick,25);SQ.raf=requestAnimationFrame(sqVis);duck();sqUI();
}
function sqStop(){
 if(!SQ.run&&!SQ.timer)return;SQ.run=false;clearInterval(SQ.timer);SQ.timer=null;cancelAnimationFrame(SQ.raf);$$('.cell.cur').forEach(c=>c.classList.remove('cur'));duck();sqUI();
}
$('#sqPlay').addEventListener('click',()=>SQ.run?sqStop():sqStart());
$('#sqClear').addEventListener('click',()=>{ROWS.forEach(r=>seq[r].fill(0));$$('.cell').forEach(c=>c.classList.remove('on'))});
$('#sqRand').addEventListener('click',()=>{
 const pr={kick:.35,snare:.25,hat:.7,synth:.45};
 ROWS.forEach(r=>{for(let s=0;s<8;s++)seq[r][s]=Math.random()<pr[r]?1:0});seq.kick[0]=1;
 $$('.cell').forEach(c=>c.classList.toggle('on',!!seq[c.dataset.r][c.dataset.s]));
});
$('#tempo').addEventListener('input',e=>{SQ.tempo=+e.target.value;$('#tempoV').textContent=SQ.tempo});

/* ================= SHARE ================= */

const mob=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const SHARE=[
 {n:'Facebook',c:'#1877f2',g:'f',u:(U)=>`https://www.facebook.com/sharer/sharer.php?u=${U}`},
 {n:'Messenger',c:'#0084ff',g:'m',u:(U)=>mob?`fb-messenger://share/?link=${U}`:`https://www.facebook.com/sharer/sharer.php?u=${U}`},
 {n:'WhatsApp',c:'#25d366',g:'W',u:(U,X)=>`https://wa.me/?text=${X}%20${U}`},
 {n:'Telegram',c:'#229ed9',g:'T',u:(U,X)=>`https://t.me/share/url?url=${U}&text=${X}`},
 {n:'Viber',c:'#7360f2',g:'V',u:(U,X)=>`viber://forward?text=${X}%20${U}`},
 {n:'X',c:'#111',g:'X',u:(U,X)=>`https://twitter.com/intent/tweet?url=${U}&text=${X}`},
 {n:'LinkedIn',c:'#0a66c2',g:'in',u:(U)=>`https://www.linkedin.com/sharing/share-offsite/?url=${U}`},
 {n:'Pinterest',c:'#e60023',g:'P',u:(U,X)=>`https://pinterest.com/pin/create/button/?url=${U}&media=${encodeURIComponent(new URL('share.jpg',location.href).href)}&description=${X}`},
 {n:'Reddit',c:'#ff4500',g:'R',u:(U,X)=>`https://www.reddit.com/submit?url=${U}&title=${X}`},
 {n:'Email',c:'#7b5a8d',g:'✉',u:(U,X)=>`mailto:?subject=${encodeURIComponent('Betty — Official Music Page')}&body=${X}%20${U}`}
];
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2200)}
async function copyLink(){
 const u=pageUrl();
 try{await navigator.clipboard.writeText(u)}catch(e){const a=document.createElement('textarea');a.value=u;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}
 toast(T('copied'));
}
function buildShare(){
 const g=$('#sgrid');g.innerHTML='';const U=encodeURIComponent(pageUrl()),X=encodeURIComponent(T('share_text'));
 SHARE.forEach(s=>{const a=document.createElement('a');a.className='sbtn';a.style.setProperty('--c',s.c);a.href=s.u(U,X);a.target='_blank';a.rel='noopener';a.innerHTML=`<span class="ic">${s.g}</span><span>${s.n}</span>`;g.appendChild(a)});
 const cp=document.createElement('button');cp.className='sbtn';cp.style.setProperty('--c','#ff3d9a');cp.innerHTML=`<span class="ic">⧉</span><span>${T('copy')}</span>`;cp.addEventListener('click',copyLink);g.appendChild(cp);
 if(navigator.share){const nb=document.createElement('button');nb.className='sbtn';nb.style.setProperty('--c','#8a5cff');nb.innerHTML=`<span class="ic">↗</span><span>${T('more')}</span>`;nb.addEventListener('click',()=>navigator.share({title:T('st_title'),text:T('share_text'),url:pageUrl()}).catch(()=>{}));g.appendChild(nb)}
}

/* ================= THEME / LANG ================= */
function applyTheme(th){document.documentElement.dataset.theme=th;store.set('betty_theme',th);document.querySelector('meta[name=theme-color]').content=th==='light'?'#fff4fa':'#07040f'}
applyTheme(store.get('betty_theme','dark'));
$('#btnTheme').addEventListener('click',()=>{applyTheme(isLight()?'dark':'light');tick()});
function applyLang(){
 document.documentElement.lang=lang;
 $$('[data-i18n]').forEach(el=>{el.innerHTML=T(el.dataset.i18n)});
 document.title=T('st_title');
 $$('#lang span').forEach(s=>s.classList.toggle('on',s.dataset.l===lang));
 buildShare();sqUI();uiSound();
 if(LB.open){const p=PH[LB.i];$('#lbT').textContent=T(p.t);$('#lbS').textContent=T(p.s)}
}
$('#lang').addEventListener('click',()=>{lang=lang==='bg'?'en':'bg';store.set('betty_lang',lang);applyLang();tick()});
$('#btnSound').addEventListener('click',()=>{setSound(!AE.on);if(AE.on)tick()});
$('#np').addEventListener('click',()=>setSound(!AE.on));
$('#vinylWrap').addEventListener('click',()=>{
 if(!AE.ctx)return;
 if(!AE.on){setSound(true)}
 const t=AE.ctx.currentTime;noise({t,dur:.35,vol:.25,ft:'bandpass',fr:2500});tone({type:'sawtooth',f:900,f2:120,t,dur:.35,vol:.08,cut:3000});
});

/* ================= INTRO ================= */
let entered=false;
function enter(sound){
 if(entered)return;entered=true;
 initAudio();AE.on=!!sound&&!!AE.ctx;
 if(AE.ctx){AE.ctx.resume();AE.master.gain.value=AE.on?.9:0}
 document.body.classList.add('entered');document.body.classList.remove('locked');
 const it=$('#intro');it.classList.add('out');setTimeout(()=>it.remove(),1800);
 if(AE.on){
  const t=AE.ctx.currentTime+.05;riser(t,.95);
  const sp=Promise.race([detectSong(),new Promise(r=>setTimeout(r,900))]);
  setTimeout(async()=>{await sp;if(!AE.on)return;boom(AE.ctx.currentTime);shimmer(AE.ctx.currentTime,84);musicStart()},950);
 }
 uiSound();
}
$('#enter').addEventListener('click',()=>enter(true));
$('#enterSilent').addEventListener('click',()=>enter(false));
document.addEventListener('visibilitychange',()=>{
 if(!AE.ctx)return;
 if(document.hidden){AE.ctx.suspend()}else{AE.ctx.resume().then(()=>{if(M.run)M.next=AE.ctx.currentTime+.05;if(SQ.run)SQ.next=AE.ctx.currentTime+.05})}
});
document.addEventListener('click',e=>{if(e.target.closest('.btn,.sbtn,.ccard,.nav a'))tick()},true);

/* init */
bgResize();applyLang();requestAnimationFrame(frame);
})();
